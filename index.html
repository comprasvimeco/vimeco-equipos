<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIMECO Equipos</title>
<meta name="theme-color" content="#022e62">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Equipos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; background: #022e62; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f3f2ee;
    padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  #cargando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; color: #fff; font: 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity .3s; }
  #cargando img { width: 120px; height: 120px; border-radius: 24px; }
  #cargando.listo { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<!-- La app real es la web app de Apps Script (proyecto «Equipos VIMECO»). Esta página solo la hace instalable. -->
<iframe id="app" title="VIMECO Equipos" allow="clipboard-write"
  src="https://script.google.com/macros/s/AKfycbwtlJaumkk8hMg5xLsDXLfNuFqXr1WBcpBraMQzul16pUHj1xjsHKU8k2Ec--hdV9aAFA/exec"></iframe>
<div id="cargando"><img src="icons/icon-192.png" alt=""><span>Cargando…</span></div>
<script>
  document.getElementById('app').addEventListener('load', function () {
    document.getElementById('cargando').classList.add('listo');
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
